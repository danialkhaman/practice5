[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.30"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200

[fuzz]
runs = 1000

[invariant]
runs = 256
depth = 64
fail_on_revert = false

# CI-профиль: больше прогонов fuzz/invariant
[profile.ci.fuzz]
runs = 5000

[profile.ci.invariant]
runs = 512
depth = 128
